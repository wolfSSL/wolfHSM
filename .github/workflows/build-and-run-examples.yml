name: Build and Run Examples

on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ '*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
        matrix:
            transport: [ 'tcp', 'shm', 'dma', 'tls', 'psk' ]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    # pull and build wolfssl
    - name: Checkout wolfssl
      uses: ./.github/actions/checkout-wolfssl

    # One job per transport; the flag combos run as a loop because a
    # matrix job per combo spends about half its time on runner setup.
    # The --test variants reuse the same binaries, so each of the 8
    # flag builds serves two client runs.
    - name: Build and run examples (all flag combos)
      run: |
        WS="$(pwd)"
        SERVER_DIR="$WS/examples/posix/wh_posix_server"
        CLIENT_DIR="$WS/examples/posix/wh_posix_client"
        TRANSPORT="${{ matrix.transport }}"
        if [ "$TRANSPORT" = "tls" ] || [ "$TRANSPORT" = "psk" ]; then
          TLS=1
        else
          TLS=0
        fi
        for ASAN in ASAN=1 ASAN=0; do
        for DEBUG in "" DEBUG_VERBOSE=1; do
        for AUTH in "" AUTH=1; do
          echo "::group::build $TRANSPORT $ASAN $DEBUG $AUTH"
          make -C "$SERVER_DIR" clean
          make -C "$CLIENT_DIR" clean
          if [ "$TRANSPORT" = "dma" ]; then
            env $ASAN $DEBUG $AUTH DMA=1 DEMO_KEK=1 \
              make -C "$SERVER_DIR" -j WOLFSSL_DIR=../../../wolfssl
            env $ASAN $DEBUG $AUTH DMA=1 \
              make -C "$CLIENT_DIR" -j WOLFSSL_DIR=../../../wolfssl
          else
            env $ASAN $DEBUG $AUTH TLS=$TLS DEMO_KEK=1 \
              make -C "$SERVER_DIR" -j WOLFSSL_DIR=../../../wolfssl
            env $ASAN $DEBUG $AUTH TLS=$TLS \
              make -C "$CLIENT_DIR" -j WOLFSSL_DIR=../../../wolfssl
          fi
          echo "::endgroup::"
          for TEST in "" --test; do
            echo "::group::run $TRANSPORT $ASAN $DEBUG $AUTH test='$TEST'"
            rm -f "$SERVER_DIR"/*.bin
            cd "$SERVER_DIR"
            if [ "$TRANSPORT" = "psk" ]; then
              echo "test_password" | ./Build/wh_posix_server.elf --type "$TRANSPORT" &
            else
              ./Build/wh_posix_server.elf --type "$TRANSPORT" &
            fi
            SERVER_PID=$!
            sleep 1
            cd "$CLIENT_DIR"
            if [ "$TRANSPORT" = "psk" ]; then
              echo "test_password" | ./Build/wh_posix_client.elf --type "$TRANSPORT" $TEST
            else
              ./Build/wh_posix_client.elf --type "$TRANSPORT" $TEST
            fi
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
            cd "$WS"
            echo "::endgroup::"
          done
        done
        done
        done

    # The client and the server are separate binaries with separate
    # user_settings.h, so the client can be built with no software SLH-DSA at
    # all while the server keeps its own. That is the only way to prove the
    # callback-only path really reaches the server: with the software stripped
    # the client has nothing to fall back to, so a passing demo means every
    # SLH-DSA operation was served over the wire. Only one transport needs to
    # run it; the ONLY macro is orthogonal to the transport.
    - name: Build and run the callback-only SLH-DSA client
      if: ${{ matrix.transport == 'tcp' }}
      run: |
        WS="$(pwd)"
        SERVER_DIR="$WS/examples/posix/wh_posix_server"
        CLIENT_DIR="$WS/examples/posix/wh_posix_client"
        make -C "$SERVER_DIR" clean
        make -C "$CLIENT_DIR" clean
        DEMO_KEK=1 make -C "$SERVER_DIR" -j WOLFSSL_DIR=../../../wolfssl
        SLHDSA_CB_ONLY=1 make -C "$CLIENT_DIR" -j WOLFSSL_DIR=../../../wolfssl
        rm -f "$SERVER_DIR"/*.bin
        cd "$SERVER_DIR"
        ./Build/wh_posix_server.elf --type tcp &
        SERVER_PID=$!
        sleep 1
        cd "$CLIENT_DIR"
        ./Build/wh_posix_client.elf --type tcp --test
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
