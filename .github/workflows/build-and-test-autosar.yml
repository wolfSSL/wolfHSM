name: Build and Test AUTOSAR Port

on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]

permissions:
  contents: read

jobs:
  # Build-only legs for csm_smoke configurations the run below does not cover.
  csm-smoke-config:
    strategy:
      matrix:
        # wolfhsm_cfg.h already sets WOLFHSM_CFG_GLOBAL_KEYS, which two objects need.
        extra: [ '-DCRYPTO_DEV_ERROR_DETECT=STD_OFF',
                 '-DCRYPTO_DRIVER_OBJECT_COUNT=2' ]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Checkout wolfssl
      uses: ./.github/actions/checkout-wolfssl

    - name: Build csm_smoke (${{ matrix.extra }})
      run: |
        cd port/autosar/classic/examples/csm_smoke
        make -j WOLFSSL_DIR=../../../../../wolfssl EXTRA_CFLAGS="${{ matrix.extra }}"

  csm-smoke:
    strategy:
      matrix:
        asan: [ 'ASAN=0', 'ASAN=1', 'TSAN=1' ]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Checkout wolfssl
      uses: ./.github/actions/checkout-wolfssl

    - name: Build POSIX server
      run: |
        cd examples/posix/wh_posix_server
        ${{ matrix.asan }} make -j WOLFSSL_DIR=../../../wolfssl

    - name: Build csm_smoke
      run: |
        cd port/autosar/classic/examples/csm_smoke
        ${{ matrix.asan }} make -j WOLFSSL_DIR=../../../../../wolfssl

    - name: Build ap_smoke (Adaptive)
      run: |
        cd port/autosar/adaptive/examples/ap_smoke
        FLAGS=""
        if [ "${{ matrix.asan }}" = "ASAN=1" ]; then
          FLAGS="-fsanitize=address -fno-omit-frame-pointer"
        fi
        cmake -S . -B build -DWOLFHSM_DIR=../../../../.. -DWOLFSSL_DIR=../../../../../wolfssl \
          -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$FLAGS"
        cmake --build build --parallel

    # The POSIX TCP server serves one client, so each binary gets a fresh one.
    - name: Run csm_smoke (Classic)
      run: |
        cd examples/posix/wh_posix_server
        ./Build/wh_posix_server.elf --type tcp &
        SRV=$!
        # Check the listen state passively; a probe connect would take the one client slot.
        for i in $(seq 1 50); do
          ss -ltn 2>/dev/null | grep -q ':23456 ' && break
          sleep 0.2
        done
        rc=0
        ( cd ../../../port/autosar/classic/examples/csm_smoke && timeout 300 ./Build/csm_smoke ) || rc=$?
        if [ $rc -eq 124 ]; then echo "csm_smoke timed out"; fi
        kill -TERM $SRV 2>/dev/null || true
        srv_rc=0
        wait "$SRV" || srv_rc=$?
        # 143 is the server's clean SIGTERM exit.
        if [ $srv_rc -ne 0 ] && [ $srv_rc -ne 143 ]; then
          echo "wh_posix_server exited with $srv_rc"
          exit 1
        fi
        exit $rc

    - name: Run ap_smoke (Adaptive)
      run: |
        cd examples/posix/wh_posix_server
        ./Build/wh_posix_server.elf --type tcp &
        SRV=$!
        for i in $(seq 1 50); do
          ss -ltn 2>/dev/null | grep -q ':23456 ' && break
          sleep 0.2
        done
        rc=0
        ( cd ../../../port/autosar/adaptive/examples/ap_smoke && timeout 300 ./build/ap_smoke ) || rc=$?
        if [ $rc -eq 124 ]; then echo "ap_smoke timed out"; fi
        kill -TERM $SRV 2>/dev/null || true
        srv_rc=0
        wait "$SRV" || srv_rc=$?
        if [ $srv_rc -ne 0 ] && [ $srv_rc -ne 143 ]; then
          echo "wh_posix_server exited with $srv_rc"
          exit 1
        fi
        exit $rc
