name: Build and Test

on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  schedule:
    # Weekly ccache reseed; also keeps caches from 7-day eviction
    - cron: '0 6 * * 1'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ '*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        # ubuntu runs the configs as parallel groups to shorten the
        # critical path. macos runs only the base group: it is there to
        # catch platform and compiler differences, not to repeat every
        # config ubuntu already covers, and its org-wide runner pool is
        # much smaller. That same small pool is why macos is dropped
        # from draft PRs.
        include: >-
          ${{ (github.event_name == 'pull_request' &&
          github.event.pull_request.draft) &&
          fromJSON('[{"os":"ubuntu-latest","group":"pq-dma"},
          {"os":"ubuntu-latest","group":"wolfcrypt"},
          {"os":"ubuntu-latest","group":"threadsafe"},
          {"os":"ubuntu-latest","group":"base"}]') ||
          fromJSON('[{"os":"ubuntu-latest","group":"pq-dma"},
          {"os":"ubuntu-latest","group":"wolfcrypt"},
          {"os":"ubuntu-latest","group":"threadsafe"},
          {"os":"ubuntu-latest","group":"base"},
          {"os":"macos-latest","group":"base"}]') }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    # List host info
    - name: Host info
      run: uname -a

    # List compiler version
    - name: List compiler version
      run: gcc --version

    # pull and build wolfssl
    - name: Checkout wolfssl
      uses: actions/checkout@v4
      with:
        repository: wolfssl/wolfssl
        path: wolfssl

    # Compiler cache; PR runs restore without saving
    - name: Set up ccache
      uses: ./.github/actions/ccache-setup
      with:
        workflow-id: build-and-test
        read-only: ${{ github.event_name == 'pull_request' }}

    # Build and test standard build
    - name: Build and test
      if: matrix.group == 'base'
      run: cd test && make clean && make -j WOLFSSL_DIR=../wolfssl && make run

    # Build and test standard build, with DMA and ASAN enabled
    - name: Build and test DMA ASAN
      if: matrix.group == 'pq-dma'
      run: cd test && make clean && make -j DMA=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with LMS and XMSS both in verify-only mode
    - name: Build and test DMA ASAN LMS/XMSS verify-only
      if: matrix.group == 'pq-dma'
      run: cd test && make clean && make -j DMA=1 ASAN=1 LMS_VERIFY_ONLY=1 XMSS_VERIFY_ONLY=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test mixed: LMS verify-only, XMSS full (exercises shared gating)
    - name: Build and test DMA ASAN LMS verify-only XMSS full
      if: matrix.group == 'pq-dma'
      run: cd test && make clean && make -j DMA=1 ASAN=1 LMS_VERIFY_ONLY=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with ML-DSA in verify-only mode
    - name: Build and test DMA ASAN MLDSA verify-only
      if: matrix.group == 'pq-dma'
      run: cd test && make clean && make -j DMA=1 ASAN=1 MLDSA_VERIFY_ONLY=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test ASAN build, with wolfCrypt tests enabled.
    - name: Build and test ASAN TESTWOLFCRYPT
      if: matrix.group == 'wolfcrypt'
      run: cd test && make clean && make -j ASAN=1 TESTWOLFCRYPT=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test ASAN build, with wolfCrypt tests enabled and using the DMA devId.
    # LMS/XMSS verify-only; full PQ runs in DMA ASAN and THREADSAFE everything
    - name: Build and test ASAN TESTWOLFCRYPT TESTWOLFCRYPT_DMA
      if: matrix.group == 'wolfcrypt'
      run: cd test && make clean && make -j ASAN=1 TESTWOLFCRYPT=1 TESTWOLFCRYPT_DMA=1 DMA=1 LMS_VERIFY_ONLY=1 XMSS_VERIFY_ONLY=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test debug build with ASAN and NOCRYPTO
    - name: Build and test ASAN DEBUG NOCRYPTO
      if: matrix.group == 'base'
      run: cd test && make clean && make -j DEBUG=1 ASAN=1 NOCRYPTO=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test debug build with ASAN and DMA
    # LMS/XMSS verify-only; full PQ runs in DMA ASAN and THREADSAFE everything
    - name: Build and test ASAN DEBUG DMA
      if: matrix.group == 'wolfcrypt'
      run: cd test && make clean && make -j DEBUG=1 ASAN=1 DMA=1 LMS_VERIFY_ONLY=1 XMSS_VERIFY_ONLY=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with SHE and ASAN
    - name: Build and test ASAN SHE
      if: matrix.group == 'wolfcrypt'
      run: cd test && make clean && make -j SHE=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with global SHE keys (all SHE slots shared across clients)
    - name: Build and test ASAN SHE_GLOBAL
      if: matrix.group == 'wolfcrypt'
      run: cd test && make clean && make -j SHE_GLOBAL=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with the global keys feature disabled (exercises the NVM
    # id translation paths, including the DMA add path, with
    # WOLFHSM_CFG_GLOBAL_KEYS undefined)
    - name: Build and test ASAN NOGLOBALKEYS DMA
      if: matrix.group == 'wolfcrypt'
      run: cd test && make clean && make -j NOGLOBALKEYS=1 DMA=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with the legacy flat client NVM id space
    # (WOLFHSM_CFG_LEGACY_CLIENT_NVM)
    - name: Build and test ASAN LEGACYNVM DMA
      if: matrix.group == 'wolfcrypt'
      run: cd test && make clean && make -j LEGACYNVM=1 DMA=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with per-client crypto affinity enabled (runs the crypto
    # affinity unit test, gated behind WOLFHSM_CFG_CRYPTO_AFFINITY)
    - name: Build and test CRYPTO_AFFINITY ASAN
      if: matrix.group == 'wolfcrypt'
      run: cd test && make clean && make -j CRYPTO_AFFINITY=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test crypto affinity alongside DMA (exercises HW-devId path)
    # LMS/XMSS verify-only; full PQ runs in DMA ASAN and THREADSAFE everything
    - name: Build and test CRYPTO_AFFINITY DMA ASAN
      if: matrix.group == 'wolfcrypt'
      run: cd test && make clean && make -j CRYPTO_AFFINITY=1 DMA=1 ASAN=1 LMS_VERIFY_ONLY=1 XMSS_VERIFY_ONLY=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with DEBUG=1
    - name: Build and test with DEBUG
      if: matrix.group == 'base'
      run: cd test && make clean && make -j DEBUG=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with DEBUG_VERBOSE=1 (includes DEBUG)
    - name: Build and test with DEBUG_VERBOSE
      if: matrix.group == 'base'
      run: cd test && make clean && make -j DEBUG_VERBOSE=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test in multithreaded mode with everything enabled
    - name: Build and test with THREADSAFE and everything
      if: matrix.group == 'threadsafe'
      run: cd test && make clean && make -j THREADSAFE=1 DMA=1 SHE=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Same, with global SHE keys
    - name: Build and test with THREADSAFE and everything and SHE_GLOBAL
      if: matrix.group == 'threadsafe'
      run: cd test && make clean && make -j THREADSAFE=1 DMA=1 SHE_GLOBAL=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test in multithreaded mode with everything enabled and wolfCrypt tests
    # LMS/XMSS verify-only; full PQ runs in DMA ASAN and THREADSAFE everything
    - name: Build and test with THREADSAFE and TESTWOLFCRYPT and everything
      if: matrix.group == 'threadsafe'
      run: cd test && make clean && make -j THREADSAFE=1 TESTWOLFCRYPT=1 DMA=1 SHE=1 ASAN=1 LMS_VERIFY_ONLY=1 XMSS_VERIFY_ONLY=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test in multithreaded mode with everything enabled and wolfCrypt tests with dma
    # LMS/XMSS verify-only; full PQ runs in DMA ASAN and THREADSAFE everything
    - name: Build and test with THREADSAFE and TESTWOLFCRYPT with DMA
      if: matrix.group == 'threadsafe'
      run: cd test && make clean && make -j THREADSAFE=1 TESTWOLFCRYPT=1 TESTWOLFCRYPT_DMA=1 DMA=1 SHE=1 ASAN=1 LMS_VERIFY_ONLY=1 XMSS_VERIFY_ONLY=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with AUTH=1
    - name: Build and test with AUTH
      if: matrix.group == 'base'
      run: cd test && make clean && make -j AUTH=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with AUTH=1 and ASAN
    - name: Build and test with AUTH ASAN
      if: matrix.group == 'base'
      run: cd test && make clean && make -j AUTH=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with AUTH=1 and THREADSAFE
    - name: Build and test with AUTH THREADSAFE ASAN
      if: matrix.group == 'base'
      run: cd test && make clean && make -j AUTH=1 THREADSAFE=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test with AUTH=1 and NOCRYPTO=1 (auth on, crypto off)
    - name: Build and test with AUTH NOCRYPTO
      if: matrix.group == 'base'
      run: cd test && make clean && make -j AUTH=1 NOCRYPTO=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test the per-client trusted certificate verify cache
    - name: Build and test with CERT_VERIFY_CACHE ASAN
      if: matrix.group == 'base'
      run: cd test && make clean && make -j CERT_VERIFY_CACHE=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    # Build and test the global (cross-client) trusted certificate verify cache
    - name: Build and test with CERT_VERIFY_CACHE_GLOBAL ASAN
      if: matrix.group == 'base'
      run: cd test && make clean && make -j CERT_VERIFY_CACHE_GLOBAL=1 ASAN=1 WOLFSSL_DIR=../wolfssl && make run

    - name: Show ccache stats
      run: ccache -s
